<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Input Types Example</h2>
    <form>
        <label>Enter Name</label>
        <input type="text" placeholder="Enter Name"/>

        <label>Enter email</label>
        <input type="email" placeholder="Enter email"/>
        <br><br>
        <label>Aadhar number</label>
        <input type="number" placeholder="Enter Aadhar number"/>

        <label>Enter password</label>
        <input type="password" placeholder="Enter password"/>
        <br><br>

        <label>enter DOB</label>
        <input type="date" />

        <label>enter month</label>
        <input type="month" />
        <br><br>

        <label>enter time</label>
        <input type="time" />
        <br><br>

        <label>enter date and time</label>
        <input type="datetime-local" />
        <br><br>

        <label>choose city</label>
        <input type="checkbox" checked/>pune
        <input type="checkbox"/>mumbai
        <input type="checkbox"/>nagpur
        <br><br>

        <label>select your gender</label>
        <input type="radio" name="gender" />male
        <input type="radio" name="gender" />female
        <br><br>

        <label>select color</label>
        <input type="color" />
        <br><br>

        <label>select range</label>
        <input type="range" />
        <br><br>

        <label>upload docs</label>
        <input type="file" multiple/>
        <label>search</label>
        <input type="search" placeholder="search here"/>

        <label>enter url</label>
        <input type="url" placeholder="https://example.com"/>

        <label>enter phone number</label>
        <input type="tel" placeholder="7888767687"/>
        <br><br><br>

        <label>enter address</label>
        <textarea rows="5" cols="30"></textarea>
        <input type="submit" value="Submit"/>
    </form>
</body>
</html>
